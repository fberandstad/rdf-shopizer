openapi: 3.0.3
info:
  title: ShopiClaw API
  version: 1.0.0
  description: >
    REST API for ShopiClaw, the agentic commerce app modernizing Shopizer v1.1.5.
    Combines commerce resources (catalog, cart, order, payment) with the embedded
    ShopiClaw agent (chat, tools, RAG). Replaces legacy Struts2 actions and JAX-WS SOAP.
    LLM provider: OpenAI. Payment via tokenization (no PAN).
servers:
  - url: /api
tags:
  - name: catalog
  - name: cart
  - name: checkout
  - name: orders
  - name: agent
  - name: admin
  - name: rag
  - name: knowledge
  - name: ops
  - name: mcp
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: shopiclaw_session
    mcpClient:
      type: http
      scheme: bearer
      description: Per-client bearer token (OAuth client-credentials) for external MCP agents; scoped to an allow-list.
  schemas:
    Product:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        price: { type: integer, description: minor currency units }
        currency: { type: string, example: EUR }
        enabled: { type: boolean }
        attributes: { type: object, additionalProperties: true }
    CartItem:
      type: object
      properties:
        productId: { type: string }
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
        options: { type: object, additionalProperties: true }
    Cart:
      type: object
      properties:
        id: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        subtotal: { type: integer }
        tax: { type: integer }
        shipping: { type: integer }
        total: { type: integer }
    Order:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [CREATED, AWAITING_PAYMENT, PAID, FULFILLED, CANCELLED] }
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        total: { type: integer }
        paymentRef: { type: string, description: tokenized reference only (no PAN) }
    AgentMessage:
      type: object
      properties:
        sessionId: { type: string }
        role: { type: string, enum: [user, assistant, tool] }
        content: { type: string }
    ToolApproval:
      type: object
      properties:
        approvalId: { type: string }
        tool: { type: string }
        decision: { type: string, enum: [approved, rejected] }
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
security:
  - sessionCookie: []
paths:
  /catalog/search:
    get:
      tags: [catalog]
      summary: Search catalog (legacy SearchAction; FS-0001, RULE-0007)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string } }
      responses:
        '200':
          description: results
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Product' } } } }
  /catalog/products/{id}:
    get:
      tags: [catalog]
      summary: Product details (FS-0001)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { description: not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /cart:
    get:
      tags: [cart]
      summary: Get current cart (FS-0002)
      responses: { '200': { description: cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } } }
  /cart/items:
    post:
      tags: [cart]
      summary: Add to cart (FS-0002; RULE-0001..0007)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CartItem' } } }
      responses:
        '200': { description: updated cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '422': { description: validation/stock error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /checkout/shipping:
    post:
      tags: [checkout]
      summary: Calculate shipping (FS-0003; RULE-0019)
      responses: { '200': { description: quotes } }
  /checkout/order:
    post:
      tags: [checkout]
      summary: Create order via order state machine (FS-0003; RULE-0008..0012)
      responses:
        '201': { description: order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
  /checkout/pay:
    post:
      tags: [checkout]
      summary: Pay order with tokenized payment (FS-0004; RULE-0009..0011; ADR-0006). GUARDED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId: { type: string }
                paymentToken: { type: string, description: provider token / hosted-field nonce (NEVER a PAN) }
      responses:
        '200': { description: payment result }
        '402': { description: payment declined; order not persisted (RULE-0012) }
  /orders:
    get:
      tags: [orders]
      summary: List my orders (FS-0005; RULE-0013)
      responses: { '200': { description: orders, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } } } }
  /orders/{id}:
    get:
      tags: [orders]
      summary: Order detail; payment masked (RULE-0014). Owner or admin only (RULE-0013).
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '403': { description: forbidden }
  /agent/sessions:
    post:
      tags: [agent]
      summary: Start an agent session (Gateway)
      responses: { '201': { description: session } }
  /agent/messages:
    post:
      tags: [agent]
      summary: Send a message to the ShopiClaw agent (Agent Loop; streamed)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentMessage' } } }
      responses:
        '200': { description: streamed assistant response (SSE) }
  /agent/approvals/{approvalId}:
    post:
      tags: [agent]
      summary: HITL approval for a guarded tool call (ClawBands)
      parameters: [ { name: approvalId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ToolApproval' } } }
      responses: { '200': { description: recorded } }
  /copilotkit:
    post:
      tags: [agent]
      summary: CopilotKit AG-UI runtime endpoint (inherited from example/)
      responses: { '200': { description: runtime response } }
  /rag/search:
    post:
      tags: [rag]
      summary: Semantic search over catalog/policies (pgvector)
      responses: { '200': { description: matches } }
  /rag/ingest:
    post:
      tags: [rag]
      summary: Ingest documents for RAG. GUARDED (admin).
      responses: { '202': { description: accepted } }
  /knowledge/search:
    post:
      tags: [knowledge]
      summary: >
        Digital Twin knowledge Q&A (twinKnowledgeSearch). Grounded answers over
        00-twin/02-reverse/03-target with traceability citations (REQ/RULE/SPEC/FS/ADR).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { question: { type: string } } } } }
      responses:
        '200':
          description: cited answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer: { type: string }
                  citations: { type: array, items: { type: object, properties: { id: { type: string }, source: { type: string } } } }
  /health:
    get:
      tags: [ops]
      summary: Liveness probe (no auth)
      security: []
      responses: { '200': { description: ok } }
  /ready:
    get:
      tags: [ops]
      summary: Readiness — DB, Redis, OpenAI, Heartbeat (getSystemHealth backing)
      responses:
        '200':
          description: status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded, down] }
                  components: { type: object, additionalProperties: { type: string } }
                  version: { type: string }
                  heartbeatLastRun: { type: string, format: date-time }
  /metrics/business:
    get:
      tags: [ops]
      summary: >
        Functional analytics (getBusinessMetrics) via named, allow-listed queries — e.g.
        orders processed, revenue, AOV, abandonment, low-stock. Role-scoped; no free-form SQL (ADR-0012).
      parameters:
        - { name: metric, in: query, required: true, schema: { type: string, enum: [orders_count, revenue, aov, cart_abandonment, top_products, low_stock_count, new_customers] } }
        - { name: period, in: query, schema: { type: string, enum: [today, week, month, ytd], default: today } }
      responses:
        '200':
          description: metric result
          content:
            application/json:
              schema:
                type: object
                properties:
                  metric: { type: string }
                  period: { type: string }
                  value: { type: number }
                  breakdown: { type: array, items: { type: object, additionalProperties: true } }
        '403': { description: forbidden (role-scoped) }
  /mcp:
    post:
      tags: [mcp]
      summary: >
        MCP (Model Context Protocol) server endpoint for external agents (ADR-0013).
        Exposes read/safe tools + twin-knowledge resources; guarded/money-path tools are NOT
        exposed by default. Per-client auth + allow-list; calls audited in tool_audit.
      security:
        - mcpClient: []
      responses:
        '200': { description: MCP JSON-RPC / streamable response }
        '403': { description: tool not in client allow-list }
  /admin/catalog:
    post:
      tags: [admin]
      summary: Manage catalog (FS-0011). GUARDED (admin role; RULE-0016/0017).
      responses: { '200': { description: ok }, '403': { description: forbidden } }
  /admin/inventory:
    post:
      tags: [admin]
      summary: Manage inventory (FS-0013). GUARDED (admin).
      responses: { '200': { description: ok } }
  /admin/refunds:
    post:
      tags: [admin]
      summary: Issue refund (requestRefund tool). GUARDED + HITL approval.
      responses: { '200': { description: ok } }
