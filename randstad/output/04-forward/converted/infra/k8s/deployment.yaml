# ShopiClaw API + SPA. Stateless (sessions in Postgres; Redis is a roadmap option for
# horizontal scale, DEBT-0019) so replicas scale horizontally. Migrations run on boot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopiclaw
  namespace: shopiclaw
  labels:
    app.kubernetes.io/name: shopiclaw
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels: { app: shopiclaw }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app: shopiclaw }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: shopiclaw
          image: ghcr.io/fberandstad/rdf-shopizer:latest   # set by CD; pin a digest in prod
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef: { name: shopiclaw-config }
            - secretRef: { name: shopiclaw-secrets }
          livenessProbe:
            httpGet: { path: /api/ops/health, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /api/ops/ready, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: "150m", memory: "256Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shopiclaw
  namespace: shopiclaw
spec:
  selector: { app: shopiclaw }
  ports:
    - name: http
      port: 80
      targetPort: 4000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shopiclaw
  namespace: shopiclaw
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopiclaw
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
