# TLS-only ingress with HSTS (RISK-0010, DPR-0001). Uses cert-manager for certs and the
# nginx ingress controller; adjust host/annotations to your environment.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopiclaw
  namespace: shopiclaw
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["shopiclaw.example.com"]
      secretName: shopiclaw-tls
  rules:
    - host: shopiclaw.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shopiclaw
                port:
                  number: 80
