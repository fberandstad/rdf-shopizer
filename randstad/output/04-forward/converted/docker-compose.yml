services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: shopiclaw
      POSTGRES_USER: shopiclaw
      POSTGRES_PASSWORD: shopiclaw
    ports:
      - "15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopiclaw"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  shopiclaw:
    build: .
    ports:
      - "14000:4000"
    # Values below interpolate from a local .env if present, else use safe dev defaults
    # so `docker compose up` works out of the box. Provide real secrets via .env in prod.
    environment:
      - NODE_ENV=production
      - PORT=4000
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=shopiclaw
      - PG_USER=shopiclaw
      - PG_PASSWORD=shopiclaw
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-a-random-string-min-32-chars}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PSP_PROVIDER=${PSP_PROVIDER:-mock}
      - MCP_CLIENT_TOKENS=${MCP_CLIENT_TOKENS:-{}}
      - COPILOTKIT_TELEMETRY_DISABLED=true
      - DO_NOT_TRACK=1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/api/ops/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pg_data:
