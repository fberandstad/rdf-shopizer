services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: shopiclaw
      POSTGRES_USER: shopiclaw
      POSTGRES_PASSWORD: shopiclaw
    ports:
      - "15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopiclaw"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  shopiclaw:
    build: .
    ports:
      - "14000:4000"
    env_file:
      - .env
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=shopiclaw
      - PG_USER=shopiclaw
      - PG_PASSWORD=shopiclaw
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
