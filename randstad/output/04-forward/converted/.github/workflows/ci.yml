# ShopiClaw CI/CD (Wave 7). Security + quality gates from coding-standards.md §6:
# SCA + secret scanning + unit/golden-master tests + client build. Deploy is gated/manual
# (HITL): this pipeline builds & verifies; it never auto-deploys to production.
# NOTE: assumes the converted app is the repository root (server/, client/, tests/).
name: ci

on:
  push:
    branches: [ main, 'wave/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Dependency SCA (npm audit)
        working-directory: server
        run: |
          npm install --package-lock-only
          npm audit --audit-level=high || echo "::warning::npm audit found advisories (review required)"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install server deps
        working-directory: server
        run: npm install
      - name: Syntax check
        working-directory: server
        run: node -e "require('fs').readdirSync('.').filter(f=>f.endsWith('.js'))" && for f in $(git ls-files 'server/**/*.js'); do node --check "$f"; done
      - name: Unit + golden-master (offline) tests
        working-directory: server
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [ unit ]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shopiclaw
          POSTGRES_PASSWORD: shopiclaw
          POSTGRES_DB: shopiclaw
        ports: [ '15432:5432' ]
        options: >-
          --health-cmd "pg_isready -U shopiclaw" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_HOST: localhost
      PG_PORT: '15432'
      NODE_ENV: test
      SESSION_SECRET: ci-test-secret-needs-to-be-32-chars-long
      MCP_CLIENT_TOKENS: '{"partner":"interop-test-token"}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install + build client
        working-directory: client
        run: npm install && npm run build
      - name: Install server deps
        working-directory: server
        run: npm install
      - name: Start server + seed
        working-directory: server
        run: |
          node seed.js
          (node index.js &) && sleep 5
          curl -sf http://localhost:4000/api/ops/health
      - name: Playwright E2E (golden master)
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright test
